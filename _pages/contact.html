---
layout: default
title: Contact
permalink: /contact/
---
<section class="contact">
  <a href="{{site.baseurl}}/" class="button_back"><i class="fa fa-long-arrow-left" aria-hidden="true"></i> Back</a>
  
  <div class="container_contact">
  <h3 class="form_title">向我发送一些你的想法吧(如果你不想公开发在评论区)</h3>

  <form action="https://formspree.io/f/{{site.formspree_email}}" method="post" class="form">
    <div class="message js-form-message"></div>
    <div class="form_group">
        <input type="text" placeholder="我应该如何称呼你呢" name="name" class="form-input" required>
    </div>
    <div class="form_group">
        <input type="email" placeholder="你的邮件" name="_replyto" class="form-input" required>
    </div>
    <div class="form_group">
        <textarea name="Message" placeholder="这里是你想说的话" cols="25" rows="6" class="form-textarea" required></textarea>
    </div>
    <div class="form_group">
        <input type="submit" class="form_btn" value="Send">
    </div>
  </form>
  </div>
</section>
